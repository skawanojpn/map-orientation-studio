意の地点に置き、ロールで新しい北方向を回転できます。中心から上へ90度離れた地点が新しい北極、下へ90度離れた地点が新しい南極となるため、通常の北極・南極とは異なる軸で地域を見られます。これは投影の性質を体験するための回転であり、UTMなどの測地系をそのまま実装したものではありません。",useful:"通常軸は航海図、横軸は南北に細長い地域や帯状の測量、斜軸は斜めに延びる地域・大圏方向の観察に役立ちます。"},equalEarth:{name:"Equal Earth図法",overview:"世界全体の面積比を正しく保つ擬円筒図法です。大陸や地域の相対的な大きさを比較する用途に向きます。",features:"面積を保つ代わりに、形・角度・距離は場所によって歪みます。曲線状の外縁が地球の丸みを示します。",normal:"通常は赤道を横方向の基準にし、北を上にした世界統計地図として使います。",changed:"中心経度を変えると、世界地図の切れ目を対象地域の反対側へ移せます。ロールや中心緯度を変えると、特定地域を別の視点で比較できますが、面積保存の性質自体は変わりません。",useful:"人口、森林、農地、気候など、地域間の面積比を比較する主題図に役立ちます."},orthographic:{name:"正射方位図法",overview:"地球を無限遠方から見たように、地球儀の半球を平面へ写す投影法です。",features:"地球の外観を自然に見せますが、中心から離れるほど形・面積・距離が歪みます。裏側の半球は表示されません。",normal:"通常は地球の中心を赤道上または極に置き、北を上にした半球表示として使います。",changed:"中心を都市や極へ移すと、その地点を正面にした地球儀のように見えます。ロールを変えると地球を回した視点になり、極を中心にすると極域の見え方と経線の集まり方を観察できます。",useful:"地球の外観、教材、衛星から見たような視点、可視半球の確認に役立ちます."},equirectangular:{name:"正距円筒図法",overview:"経度と緯度を一定間隔で平面上に配置する、単純で扱いやすい円筒図法です。",features:"赤道付近では比較的素直ですが、高緯度ほど形・面積・距離が歪みます。経緯度データとの対応が直感的です。",normal:"通常は赤道を中心線にし、北を上、経度を横、緯度を縦に配置します。",changed:"中心経度を変えると地図の切れ目を移せます。中心緯度やロールを変えると、データの基準方向を変えた見え方を比較できます。",useful:"座標データの確認、簡易的な世界分布図、テクスチャやグリッドの下地に役立ちます."},sinusoidal:{name:"サンソン図法",overview:"面積を保つ擬円筒図法で、サンソン＝フラムスティード図法とも呼ばれます。",features:"赤道と中央経線は直線、その他の経線は正弦曲線です。極は点になり、世界全体の面積比較に向きます。",normal:"通常は赤道を水平、中央経線を垂直にした世界図として使います。",changed:"中心経度を変えると中央経線と地図の切れ目を移せます。中心・ロールを変えても面積保存は変わりませんが、比較したい地域を見やすい方向に置けます。",useful:"大陸・植生・人口など、世界規模の面積比較に役立ちます。"},mollweide:{name:"モルワイデ図法",overview:"世界全体を楕円形に収める正積擬円筒図法です。",features:"面積を正しく保つ一方、形・角度・距離には歪みがあります。極は上下の一点に集約されます。",normal:"通常は赤道を長軸、中央経線を短軸とする北向きの楕円世界図として使います。",changed:"中心経度を変えると中央経線と切れ目を移せます。中心緯度やロールを変えると、別の軸から世界の面積分布を見比べられます。",useful:"全球の気候、土地利用、人口などを面積の偏りなく比較するのに役立ちます。"},goode:{name:"グード図法（ホモロサイン図法）",overview:"サンソン図法とモルワイデ図法を緯度帯ごとに組み合わせた、中断式の正積図法です。",features:"海洋に切れ目を置くことで陸地の形と面積の歪みを抑えます。海を連続して読む用途には不向きです。",normal:"通常は複数の葉状領域を北向きに配置し、各領域で面積を正しく保ちます。",changed:"中心経度を変えると葉状領域の基準方向と切れ目の位置を変えて、注目地域を別の葉に置けます。ロールや中心緯度を変えた場合も、正積性は保たれます。 le and distance vary by location because area preservation is prioritized. Its curved outer edge suggests the spherical Earth.",normal:"It is normally used as a north-up global statistical map with the equator as the horizontal reference.",changed:"Changing center longitude moves the map seam away from the region of interest. Changing latitude or roll changes the viewing frame, not the equal-area property.",useful:"Useful for comparing population, forests, farmland, climate and other area-based global patterns."},orthographic:{name:"Orthographic",overview:"A perspective-like azimuthal projection showing a hemisphere as if viewed from far away in space.",features:"It provides a natural globe-like appearance, while shape, area and distance distort toward the edge. The far hemisphere is hidden.",normal:"It is normally used as a north-up globe view centered on the equator or a pole.",changed:"Moving the center puts a city or pole in front, like rotating a globe. Changing roll rotates the viewpoint, and polar centers reveal how meridians gather.",useful:"Useful for globe views, teaching, satellite-like viewpoints and checking the visible hemisphere."},equirectangular:{name:"Equirectangular",overview:"A simple cylindrical projection that places longitude and latitude at even intervals.",features:"It is intuitive for coordinate data, but shape, area and distance distort increasingly toward high latitudes.",normal:"The usual aspect has the equator as the central line, north at the top, longitude horizontal and latitude vertical.",changed:"Changing center longitude moves the seam. Changing center latitude or roll lets you compare a different data frame or reference direction.",useful:"Useful for inspecting coordinates, simple global distributions and map textures or gridded data."},sinusoidal:{name:"Sinusoidal",overview:"An equal-area pseudocylindrical projection, also known as the Sanson–Flamsteed projection.",features:"The equator and central meridian are straight while ot
