ographic:{name:"正射方位図法",overview:"地球を無限遠方から見たように、地球儀の半球を平面へ写す投影法です。",features:"地球の外観を自然に見せますが、中心から離れるほど形・面積・距離が歪みます。裏側の半球は表示されません。",normal:"通常は地球の中心を赤道上または極に置き、北を上にした半球表示として使います。",changed:"中心を都市や極へ移すと、その地点を正面にした地球儀のように見えます。ロールを変えると地球を回した視点になり、極を中心にすると極域の見え方と経線の集まり方を観察できます。",useful:"地球の外観、教材、衛星から見たような視点、可視半球の確認に役立ちます."},equirectangular:{name:"正距円筒図法",overview:"経度と緯度を一定間隔で平面上に配置する、単純で扱いやすい円筒図法です。",features:"赤道付近では比較的素直ですが、高緯度ほど形・面積・距離が歪みます。経緯度データとの対応が直感的です。",normal:"通常は赤道を中心線にし、北を上、経度を横、緯度を縦に配置します。",changed:"中心経度を変えると地図の切れ目を移せます。中心緯度やロールを変えると、データの基準方向を変えた見え方を比較できます。",useful:"座標データの確認、簡易的な世界分布図、テクスチャやグリッドの下地に役立ちます."},sinusoidal:{name:"サンソン図法",overview:"面積を保つ擬円筒図法で、サンソン＝フラムスティード図法とも呼ばれます。",features:"赤道と中央経線は直線、その他の経線は正弦曲線です。極は点になり、世界全体の面積比較に向きます。",normal:"通常は赤道を水平、中央経線を垂直にした世界図として使います。",changed:"中心経度を変えると中央経線と地図の切れ目を移せます。中心・ロールを変えても面積保存は変わりませんが、比較したい地域を見やすい方向に置けます。",useful:"大陸・植生・人口など、世界規模の面積比較に役立ちます。"},mollweide:{name:"モルワイデ図法",overview:"世界全体を楕円形に収める正積擬円筒図法です。",features:"面積を正しく保つ一方、形・角度・距離には歪みがあります。極は上下の一点に集約されます。",normal:"通常は赤道を長軸、中央経線を短軸とする北向きの楕円世界図として使います。",changed:"中心経度を変えると中央経線と切れ目を移せます。中心緯度やロールを変えると、別の軸から世界の面積分布を見比べられます。",useful:"全球の気候、土地利用、人口などを面積の偏りなく比較するのに役立ちます。"},goode:{name:"グード図法（ホモロサイン図法）",overview:"サンソン図法とモルワイデ図法を緯度帯ごとに組み合わせた、中断式の正積図法です。",features:"海洋に切れ目を置くことで陸地の形と面積の歪みを抑えます。海を連続して読む用途には不向きです。",normal:"通常は複数の葉状領域を北向きに配置し、各領域で面積を正しく保ちます。",changed:"中心経度を変えると葉状領域の基準方向と切れ目の位置を変えて、注目地域を別の葉に置けます。ロールや中心緯度を変えた場合も、正積性は保たれます。",useful:"大陸単位の分布や全球統計を、陸地の形を保ちながら比較するのに役立ちます。"}},en:{azimuthal:{name:"Azimuthal Equidistant",overview:"An azimuthal projection that preserves distance and direction from the chosen center point.",features:"Shape and area distortion increase away from the center. The map reaches toward the antipode, where distortion becomes extreme.",normal:"It is commonly used with a pole or a city at the center and north kept at the top. The axis is the reference direction of the graticule.",changed:"Moving the center to Tokyo or any point makes distance and direction from that point readable. Changing roll rotates the frame while keeping the center facing forward.",useful:"Useful for air routes, communication reach, center-based distance comparison and polar route analysis."},mercator:{name:"Mercator",overview:"A conformal cylindrical projection that preserves local angles and represents constant-bearing rhumb lines as straight lines.",features:"Scale, area and distance increase rapidly toward the poles; the poles cannot be shown at finite height.",normal:"The usual aspect has the equator as the reference, north at the top, vertical meridians and horizontal parallels. The top and bottom directions lead toward Earth’s ordinary North and South Poles.",changed:"In this app, any point on Earth can become the screen center, defining a rotated longitude-latitude frame through that point. Roll rotates the new north direction to any heading. The location 90 degrees above the center becomes the new north pole, and the location 90 degrees below becomes the new south pole, so the map can use an oblique axis different from Earth’s usual poles.",useful:"Useful for making a chosen region or great-circle direction the map’s main axis, and for examining regional geometry, oblique routes and rhumb lines relative to an arbitrary reference frame."},equalEarth:{name:"Equal Earth",overview:"An equal-area pseudocylindrical projection that preserves relative area across the world.",features:"Shape, angle and distance vary by location because area preservation is prioritized. Its curved outer edge suggests the spherical Earth.",normal:"It is normally used as a north-up global statistical map with the equator as the horizontal reference.",changed:"Changing center longitude moves the map seam away from the region of interest. Changing latitude or roll changes the viewing frame, not the equal-area property.",useful:"Useful for comparing population, forests, farmland, climate and other area-based global patterns."},orthographic:{name:"Orthographic",overview:"A perspective-like azimuthal projection showing a hemisphere as if viewed from far away in space.",features:"It provides a natural globe-like appearance, while shape, area and distance distort toward the edge. The far hemisphere is hidden.",normal:"It is normally used as a north-up globe view centered on the equator or a pole.",changed:"Moving the center puts a city or pole in front, like rotating a globe. Changing roll rotates the viewpoint, and polar centers reveal how meridians gather.",useful:"Useful for globe views, teaching, satellite-like viewpoints and checking the visible hemisphere."},equirectangular:{name:"Equirectangular",overview:"A simple cylindrical projection that places longitude and latitude at even intervals.",features:"It is intuitive for coordinate data, but shape, area and distance distort increasingly toward high latitudes.",normal:"The usual aspect has the equator as the central line, north at the top, longitude horizontal and latitude vertical.",changed:"Changing center longitude moves the seam. Changing center latitude or roll lets you compare a different data frame or reference direction.",useful:"Useful for inspecting coordinates, simple global distributions and map textures or gridded data."},sinusoidal:{name:"Sinusoidal",overview:"An equal-area pseudocylindrical projection, also known as the Sanson–Flamsteed projection.",features:"The equator and central meridian are straight while other meridians are sinusoidal curves; the poles become points.",normal:"The usual aspect has a horizontal equator and vertical central meridian.",changed:"Changing center longitude moves the central meridian and seam. Center and roll change the comparison frame without removing the equal-area property.",useful:"Useful for global comparisons of land cover, population and other area-based patterns."},mollweide:{name:"Mollweide",overview:"An equal-area pseudocylindrical projection that frames the world in an ellipse.",features:"It preserves area while allowing shape, angle and distance distortion; the poles collapse to points at the ellipse ends.",normal:"The usual aspect places the equator on the major axis and the central meridian on the minor axis.",changed:"Changing center longitude moves the central meridian and seam. Changing latitude or roll provides another reference frame for comparing global area patterns.",useful:"Useful for global climate, land-use and population maps where area comparison matters."},goode:{name:"Goode Homolosine",overview:"An interrupted equal-area projection combining sinusoidal and Mollweide zones.",features:"Interruptions are placed mainly through oceans to reduce land distortion, but ocean-spanning routes are broken.",normal:"The usual aspect places several lobes north-up, preserving area within each lobe.",changed:"Changing center longitude changes the reference direction and seam arrangement for exploration. Center and roll do not remove the equal-area property.",useful:"Useful for comparing continental distributions and global statistics with reduced land-shape distortion."}}},Hu={ja:{center:["中心は、地図の正面に向ける地点です。正距方位図法では、中心からの距離と方位を読む基準になります。","東京中心なら東京から見た世界、北極中心なら北極から見た世界になります。航路、通信範囲、地域間の関係を観察するときに役立ちます。"],axis:["ロールは、中心を正面に向けたまま地図を時計回り・反時計回りに回す角度です。","北を上に固定しないことで、中心地点から見た前方・左右・上下の関係や、斜めの基準軸を比較できます。"],pole:["極を中心に設定すると、極から見た経度方向の広がりと、緯度線の集まり方を観察できます。","北極・南極付近の航路、極域の面積歪み、日付変更線や経度線の連続性を見るときに役立ちます。"]},en:{center:["The center is the point facing the viewer. In an azimuthal equidistant map, it is the reference for distance and direction.","Centering Tokyo shows the world from Tokyo; centering the North Pole shows the world from the pole. This helps inspect routes, reach and regional relationships."],axis:["Roll rotates the map clockwise or counterclockwise while keeping the center facing you.","It lets you compare forward, sideways and diagonal relationships without forcing north to remain at the top."],pole:["Centering a pole reveals how longitude fans out and how latitud
