ると中央経線と切れ目を移せます。中心緯度やロールを変えると、別の軸から世界の面積分布を見比べられます。",useful:"全球の気候、土地利用、人口などを面積の偏りなく比較するのに役立ちます。"},goode:{name:"グード図法（ホモロサイン図法）",overview:"サンソン図法とモルワイデ図法を緯度帯ごとに組み合わせた、中断式の正積図法です。",features:"海洋に切れ目を置くことで陸地の形と面積の歪みを抑えます。海を連続して読む用途には不向きです。",normal:"通常は複数の葉状領域を北向きに配置し、各領域で面積を正しく保ちます。",changed:"中心経度を変えると葉状領域の基準方向と切れ目の位置を変えて、注目地域を別の葉に置けます。ロールや中心緯度を変えた場合も、正積性は保たれます。",useful:"大陸単位の分布や全球統計を、陸地の形を保ちながら比較するのに役立ちます。"}},en:{azimuthal:{name:"Azimuthal Equidistant",overview:"An azimuthal projection that preserves distance and direction from the chosen center point.",features:"Shape and area distortion increase away from the center. The map reaches toward the antipode, where distortion becomes extreme.",normal:"It is commonly used with a pole or a city at the center and north kept at the top. The axis is the reference direction of the graticule.",changed:"Moving the center to Tokyo or any point makes distance and direction from that point readable. Changing roll rotates the frame while keeping the center facing forward.",useful:"Useful for air routes, communication reach, center-based distance comparison and polar route analysis."},mercator:{name:"Mercator",overview:"A conformal cylindrical projection that preserves local angles and represents constant-bearing rhumb lines as straight lines.",features:"Scale, area and distance increase rapidly toward the poles; the poles cannot be shown at finite height.",normal:"The usual aspect has the equator as the reference, north at the top, vertical meridians and horizontal parallels. The top and bottom directions lead toward Earth’s ordinary North and South Poles.",changed:"In this app, any point on Earth can become the screen center, defining a rotated longitude-latitude frame through that point. Roll rotates the new north direction to any heading. The location 90 degrees above the center becomes the new north pole, and the location 90 degrees below becomes the new south pole, so the map can use an oblique axis different from Earth’s usual
